name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          MAIN_KT=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            cp "$MAIN_KT" app/src/main/java/com/example/hourlychime/MainActivity.kt
          fi

          MANIFEST=$(find app -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST" ] && [ "$MANIFEST" != "app/src/main/AndroidManifest.xml" ]; then
            cp "$MANIFEST" app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "haram-clock"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaramClock-APK
          path: app/build/outputs/apk/debug/*.apk
          
